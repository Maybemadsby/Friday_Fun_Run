<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Friday Night Fun Run</title>
<style>
  :root{
    --ink: #1B0F3D;
    --cyan: #00E5FF;
    --magenta: #FF2E9A;
    --gold: #FFD23F;
    --orange: #FF7A3D;
    --violet: #4B1F8C;
    --cream: #FFF8E7;
  }
  * { box-sizing: border-box; }
  html, body{ margin:0; padding:0; }
  body{
    background:
      repeating-linear-gradient(0deg, rgba(255,255,255,0.05) 0px, rgba(255,255,255,0.05) 1px, transparent 1px, transparent 40px),
      repeating-linear-gradient(90deg, rgba(255,255,255,0.05) 0px, rgba(255,255,255,0.05) 1px, transparent 1px, transparent 40px),
      linear-gradient(160deg, var(--violet) 0%, var(--magenta) 55%, var(--orange) 100%);
    color: var(--cream);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 48px 20px 60px;
    overflow-x: hidden;
  }

  header{ text-align:center; margin-bottom:44px; max-width:520px; position:relative; }
  .sunglow{
    position:absolute;
    top:-70px; left:50%;
    transform: translateX(-50%);
    width: 260px; height:260px;
    border-radius:50%;
    background: radial-gradient(circle, var(--gold) 0%, var(--orange) 45%, transparent 75%);
    filter: blur(6px);
    z-index:-1;
    opacity:0.85;
  }
  h1{
    font-family: "Arial Black", Impact, "Haettenschweiler", sans-serif;
    font-size: clamp(2.1rem, 7vw, 3.2rem);
    text-transform: uppercase;
    letter-spacing: 0.02em;
    margin: 0 0 14px;
    line-height: 1.05;
    color: var(--gold);
    text-shadow: 3px 3px 0 var(--magenta), 6px 6px 0 var(--ink);
  }
  header p{
    color: var(--cream);
    margin: 0;
    font-size: 1.05rem;
    font-weight: 600;
    opacity: 0.9;
  }

  main{
    display: flex;
    flex-direction: column;
    gap: 32px;
    width: 100%;
    max-width: 940px;
  }
  @media (min-width: 760px){
    main{ flex-direction: row; align-items: flex-start; }
  }

  .panel{
    flex: 1;
    border-radius: 28px;
    padding: 26px 22px 30px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    border: 5px solid var(--ink);
    box-shadow: 8px 8px 0 var(--ink);
  }
  .panel.run{ background: var(--cyan); }
  .panel.theme{ background: var(--magenta); }

  .panel-label{
    font-family: "Arial Black", Impact, "Haettenschweiler", sans-serif;
    font-size: 1rem;
    letter-spacing: 0.05em;
    color: var(--ink);
    background: var(--cream);
    padding: 4px 16px;
    border-radius: 999px;
    border: 3px solid var(--ink);
  }

  .lights{ display:flex; justify-content:center; gap:7px; }
  .bulb{
    width:10px; height:10px;
    border-radius:50%;
    background: var(--ink);
    animation: chase 1.8s linear infinite;
  }
  .lights.fast .bulb{ animation-duration: 0.4s; }
  .lights.flash .bulb{
    animation: none !important;
    background: #fff !important;
    box-shadow: 0 0 10px #fff, 0 0 18px var(--gold) !important;
  }
  @keyframes chase{
    0%, 82%, 100% { background: var(--ink); box-shadow: none; }
    12% { background: var(--bulb-color, var(--gold)); box-shadow: 0 0 8px var(--bulb-color, var(--gold)), 0 0 16px var(--bulb-color, var(--gold)); }
  }

  button.spin{
    font-family: "Arial Black", Impact, "Haettenschweiler", sans-serif;
    font-size: clamp(0.95rem, 2.4vw, 1.15rem);
    text-transform: uppercase;
    letter-spacing: 0.02em;
    width: 148px;
    height: 148px;
    border-radius: 50%;
    border: 6px solid var(--ink);
    background: var(--gold);
    color: var(--ink);
    cursor: pointer;
    box-shadow: 0 9px 0 var(--ink);
    transition: transform 0.08s ease, box-shadow 0.08s ease;
  }
  button.spin:hover{ filter: brightness(1.05); }
  button.spin:active{ transform: translateY(7px); box-shadow: 0 2px 0 var(--ink); }
  button.spin:disabled{ opacity: .7; cursor: default; }
  button.spin:focus-visible{ outline: 3px solid var(--cream); outline-offset: 4px; }

  .result{
    width: 100%;
    min-height: 130px;
    border-radius: 18px;
    background: var(--ink);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 22px 18px;
    gap: 8px;
    border: 3px solid var(--ink);
  }
  .result.empty .result-name{ color: rgba(255,248,231,0.55); font-weight: 500; }
  .result-name{
    font-family: "Arial Black", Impact, "Haettenschweiler", sans-serif;
    font-size: 1.15rem;
    color: var(--cream);
    text-transform: uppercase;
    letter-spacing: 0.01em;
  }
  .result-desc{
    font-size: 0.9rem;
    color: rgba(255,248,231,0.75);
    max-width: 320px;
    line-height: 1.4;
    font-weight: 500;
  }
  .result.shuffling .result-name{ opacity: .55; }
  .result.landed{ animation: popIn 0.28s ease; }
  @keyframes popIn{
    0% { transform: scale(0.9); }
    60% { transform: scale(1.04); }
    100% { transform: scale(1); }
  }

  .theme-image{
    width: 100%;
    max-width: 260px;
    aspect-ratio: 1 / 1;
    border-radius: 14px;
    object-fit: cover;
    border: 3px solid var(--cream);
  }
  .theme-placeholder{
    width: 100%;
    max-width: 260px;
    aspect-ratio: 1 / 1;
    border-radius: 14px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    font-size: 2.2rem;
    background: linear-gradient(135deg, var(--violet), var(--magenta));
    color: var(--cream);
    border: 3px solid var(--cream);
  }
  .theme-placeholder span.hint{
    font-size: 0.7rem;
    max-width: 170px;
    font-weight: 600;
  }

  footer{
    margin-top: 46px;
    color: var(--cream);
    font-size: 0.85rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    text-align: center;
    opacity: 0.85;
  }
</style>
</head>
<body>

<header>
  <div class="sunglow" aria-hidden="true"></div>
  <h1>Friday Night Fun Run</h1>
</header>

<main>
  <section class="panel run">
    <div class="lights" id="runLightsTop"></div>
    <button class="spin" id="runBtn">Run</button>
    <div class="lights" id="runLightsBottom"></div>
    <div class="result empty" id="runResult">
      <div class="result-name">Tap to spin</div>
    </div>
  </section>

  <section class="panel theme">
    <div class="lights" id="themeLightsTop"></div>
    <button class="spin" id="themeBtn">Theme</button>
    <div class="lights" id="themeLightsBottom"></div>
    <div class="result empty" id="themeResult">
      <div class="result-name">Tap to spin</div>
    </div>
  </section>
</main>


<script>
  const runTypes = [
    { name: "1 Mile Run" },
    { name: "1.5 Mile Run" },
    { name: "2 Mile Run" },
    { name: "2.5 Mile Run" },
    { name: "3 Mile Run" },
    { name: "3.5 Mile Run" },
    { name: "4 Mile Run" },
    { name: "5K Run" },
    { name: "2-Mile Negative Split Run", desc: "Run the first mile easy, then push faster for the second mile." },
    { name: "3-Mile Negative Split Run", desc: "Run the first 1.5 miles easy, then push faster for the second 1.5 miles." },
    { name: "30-Minute Interval Run", desc: "5-minute warmup jog, then alternate 3 minutes fast / 1 minute easy recovery for the remaining 25 minutes." },
    { name: "20-Minute Structured Fartlek Run", desc: "5-minute warmup jog, then repeat 1 minute fast / 2 minutes easy for the remaining 15 minutes (about 5 rounds)." },
    { name: "25-Minute Pyramid Interval Run", desc: "5-minute warmup jog, then run fast intervals of 1-2-3-2-1 minutes, with 1 minute easy recovery between each." },
    { name: "35-Minute Ladder Run", desc: "5-minute warmup jog, then run intervals of 1-2-3-2-1 minutes fast, with 1 minute easy recovery between each, plus extra easy jogging to fill the time." },
  ];

  // To show a picture when a theme is spun, paste an image URL into that
  // theme's "image" field below (a hosted link, or a base64 data URI if you
  // want the file fully self-contained). Leave it blank and you'll get a
  // placeholder card instead.
  const themes = [
    { name: "Rave Run", image: "rave.png" },
    { name: "Spy Run", note: "All black + spy music", image: "spy.png" },
    { name: "Funny Hat Run", image: "hat.png" },
    { name: "Glow Run", image: "glow.png" },
    { name: "Anything That Lights Up Run", image: "light_up.png" },
    { name: "Punk/Emo Run", image: "emo.png" },
    { name: "Space Run", image: "space.png" },
    { name: "Pirate Run", image: "pirate.png" },
    { name: "Heroes vs. Villains Run", image: "hero_villain.png" },
    { name: "Mario Kart Run", image: "mario.png" },
    { name: "Pokémon Run", image: "pokemon.png" },
    { name: "Disney Run", image: "disney.png" },
    { name: "2000s Hits Run", image: "2000s.png" },
    { name: "Color Theme Run", image: "color.png" },
    { name: "Flannel Run", note: "Flannel/plaid shirts + acoustic-folk playlist", image: "flannel.png" },
    { name: "Jersey Night Run", note: "Favorite team jerseys + stadium anthems", image: "jersey.png" },
    { name: "College Throwback Run", note: "Old college shirt + college throwback playlist", image: "college.png" },
    { name: "Jurassic Park Run", note: "Khaki/olive bandana + the movie's adventure score", image: "jurassic_park.png" },
    { name: "Wizard Run", note: "LED-tip toy wand + fantasy movie scores", image: "wizard.png" },
    { name: "Safari Run", note: "Animal-print bandana/headband - pick your own music", image: "safari.png" },
  ];

  const placeholderEmoji = ["🎧", "✨", "🌙", "🏃", "🔥", "🎬", "🌀", "🎉"];
  const bulbColors = ["#FFD23F", "#FF2E9A", "#00E5FF"];

  function buildLights(containerId, count){
    const container = document.getElementById(containerId);
    for (let i = 0; i < count; i++){
      const bulb = document.createElement("div");
      bulb.className = "bulb";
      bulb.style.setProperty("--bulb-color", bulbColors[i % bulbColors.length]);
      bulb.style.animationDelay = `${-(i * 0.15)}s`;
      container.appendChild(bulb);
    }
  }
  ["runLightsTop", "runLightsBottom", "themeLightsTop", "themeLightsBottom"].forEach(id => buildLights(id, 9));

  function pickRandom(arr){
    return arr[Math.floor(Math.random() * arr.length)];
  }

  function setLightSpeed(prefix, fast){
    [`${prefix}LightsTop`, `${prefix}LightsBottom`].forEach(id => {
      document.getElementById(id).classList.toggle("fast", fast);
    });
  }

  function flashLights(prefix){
    [`${prefix}LightsTop`, `${prefix}LightsBottom`].forEach(id => {
      const el = document.getElementById(id);
      el.classList.add("flash");
      setTimeout(() => el.classList.remove("flash"), 260);
    });
  }

  function spin(prefix, button, resultEl, list, renderFinal){
    button.disabled = true;
    resultEl.classList.remove("empty", "landed");
    resultEl.classList.add("shuffling");
    setLightSpeed(prefix, true);
    let ticks = 0;
    const maxTicks = 16;
    const interval = setInterval(() => {
      const r = pickRandom(list);
      resultEl.innerHTML = `<div class="result-name">${r.name}</div>`;
      ticks++;
      if (ticks >= maxTicks){
        clearInterval(interval);
        const final = pickRandom(list);
        resultEl.classList.remove("shuffling");
        setLightSpeed(prefix, false);
        flashLights(prefix);
        renderFinal(resultEl, final);
        resultEl.classList.add("landed");
        button.disabled = false;
      }
    }, 70);
  }

  document.getElementById("runBtn").addEventListener("click", () => {
    const resultEl = document.getElementById("runResult");
    spin("run", document.getElementById("runBtn"), resultEl, runTypes, (el, r) => {
      el.innerHTML = `
        <div class="result-name">${r.name}</div>
        ${r.desc ? `<div class="result-desc">${r.desc}</div>` : ""}
      `;
    });
  });

  function placeholderHTML(){
    return `<div class="theme-placeholder">
               <span>${pickRandom(placeholderEmoji)}</span>
               <span class="hint">Add a photo for this theme</span>
             </div>`;
  }

  document.getElementById("themeBtn").addEventListener("click", () => {
    const resultEl = document.getElementById("themeResult");
    spin("theme", document.getElementById("themeBtn"), resultEl, themes, (el, r) => {
      const visual = r.image
        ? `<img class="theme-image" id="themeImg" src="${r.image}" alt="${r.name}">`
        : placeholderHTML();
      el.innerHTML = `
        ${visual}
        <div class="result-name">${r.name}</div>
        ${r.note ? `<div class="result-desc">${r.note}</div>` : ""}
      `;
      if (r.image){
        const img = el.querySelector("#themeImg");
        img.addEventListener("error", () => { img.outerHTML = placeholderHTML(); });
      }
    });
  });
</script>

</body>
</html>
